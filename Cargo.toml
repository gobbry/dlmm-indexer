[workspace]
members = ["core", "api"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
dlmm_core = { path = "core" }

axum = "0.8.9"
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
base64 = "0.23.1"
bs58 = "0.5.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
governor = { version = "0.10.4", default-features = false, features = ["std", "jitter", "quanta"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "rustls"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Dev-only: proves the discriminator constants against their Anchor names.
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "rust_decimal",
    "migrate",
    "macros",
] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
# The 14.x client is the one built against the 13.x proto; the 13.x clients pin proto 12.
yellowstone-grpc-client = "=14.0.1"
yellowstone-grpc-proto = { version = "=13.0.0", default-features = false, features = ["tonic", "tonic-compression"] }
# rustls carries both ring and aws-lc-rs here (reqwest, sqlx), so tonic must name its provider
# or building a TLS config panics; aws-lc-rs is already in the tree. zstd is the Geyser stream's
# wire compression (the proto's tonic-compression feature already builds it in).
tonic = { version = "0.14.6", features = ["tls-aws-lc", "zstd"] }
futures = "0.3.34"
